<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lumic - Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://js.paystack.co/v1/inline.js"></script>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <meta name="theme-color" content="#10b981">
  <style>
    html,body{width:100%;}
    body{background:linear-gradient(180deg,#050506,#09090b);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;color:#fff}
    .card{background:linear-gradient(180deg,rgba(255,255,255,0.03),rgba(255,255,255,0.02));border:1px solid rgba(255,255,255,0.06);border-radius:18px;padding:18px}
    .premium-hero{background:linear-gradient(135deg,#0ea5a2,#10b981);padding:20px;border-radius:18px;color:#001;box-shadow:0 10px 30px rgba(16,185,129,0.12)}
    .uid-chip{font-family:ui-monospace,Menlo,monospace;letter-spacing:.12em}
    .gem{width:72px;height:72px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:28px}
    .btn-ghost{background:transparent;border:1px solid rgba(255,255,255,0.06);padding:10px 14px;border-radius:12px}
  </style>
</head>
<body>
<div style="max-width:720px;margin:28px auto;padding:16px">
  <div class="premium-hero" style="display:flex;gap:14px;align-items:center">
    <div id="profileGem" class="gem">?</div>
    <div style="flex:1">
      <div id="profileDisplayName" style="font-weight:900;font-size:20px">—</div>
      <div id="profileUsername" style="color:rgba(255,255,255,0.8);margin-top:6px">—</div>
      <div style="margin-top:10px;display:flex;gap:8px">
        <button id="btnPayNow" class="btn-ghost" style="background:#fff;color:#000;font-weight:800">Pay ₦300</button>
        <button id="btnShareUid" class="btn-ghost">Share ID</button>
      </div>
    </div>
    <div style="text-align:right">
      <div style="font-size:12px;color:rgba(0,0,0,0.35)">Premium</div>
      <div id="premiumBadge" style="font-weight:900">Free</div>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px">
    <div class="card">
      <div style="font-size:12px;color:#9ca3af">Referral progress</div>
      <div style="margin-top:8px;font-weight:800;font-size:18px" id="referralCount">0 / 3</div>
      <div style="height:8px;background:rgba(255,255,255,0.04);border-radius:12px;margin-top:10px"><div id="referralProgress" style="height:100%;width:0;background:linear-gradient(90deg,#10b981,#34d399);border-radius:12px"></div></div>
    </div>
    <div class="card">
      <div style="font-size:12px;color:#9ca3af">Member since</div>
      <div style="margin-top:8px;font-weight:700" id="memberSince">—</div>
      <div style="margin-top:12px;font-size:12px;color:#9ca3af">Referred by</div>
      <div style="margin-top:8px;font-weight:700" id="referredBy">—</div>
    </div>
  </div>

  <div class="card" style="margin-top:16px">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div style="font-weight:900">Downloads</div>
      <div style="color:#9ca3af;font-size:13px" id="offlineSummary">0 songs</div>
    </div>
    <div id="offlineList" style="margin-top:12px"></div>
  </div>

  <div style="margin-top:16px;text-align:center">
    <a href="lumic.html" style="color:#9ca3af">Back to player</a>
  </div>
</div>

<script src="/pwa-enhancements.js"></script>
<script src="/idb.js"></script>
<script>
const supabaseUrl = "https://fhogysmvpqakzoxwhxht.supabase.co";
const supabaseAnonKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZob2d5c212cHFha3pveHdoeGh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3MTg0OTcsImV4cCI6MjEwMDI5NDQ5N30.0WB";
const supabase = window.supabase.createClient(supabaseUrl, supabaseAnonKey);
let currentUser = null, currentProfile = null;
window.addEventListener('DOMContentLoaded', bootProfile);
async function bootProfile(){
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) { window.location.href = 'index.html'; return; }
  currentUser = session.user;
  const { data: profile } = await supabase.from('profiles').select('*').eq('id', currentUser.id).maybeSingle();
  if (!profile) { window.location.href='index.html'; return; }
  currentProfile = profile;
  document.getElementById('profileDisplayName').innerText = profile.display_name || (currentUser.email||'').split('@')[0];
  document.getElementById('profileUsername').innerText = '@' + profile.username;
  document.getElementById('memberSince').innerText = new Date(profile.created_at).toLocaleDateString();
  document.getElementById('referredBy').innerText = profile.referred_by || 'No one';
  document.getElementById('premiumBadge').innerText = profile.is_premium? 'Active' : 'Free';
  // render gem
  const gem = document.getElementById('profileGem');
  if (window.LumicPWA) window.LumicPWA.renderGem(profile.username);
  // referrals
  const { count } = await supabase.from('referrals').select('id', { count:'exact', head:true }).eq('referrer_id', currentUser.id);
  const rc = count||0; document.getElementById('referralCount').innerText = `${Math.min(rc,3)} / 3`; document.getElementById('referralProgress').style.width = `${Math.min(100,(rc/3)*100)}%`;
  // offline list
  const list = await window.LumicIDB.listSongs(); document.getElementById('offlineSummary').innerText = `${list.length} songs`;
  const offlineList = document.getElementById('offlineList'); offlineList.innerHTML = list.map(s=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px;border-radius:8px;background:rgba(255,255,255,0.02);margin-bottom:8px"><div><div style="font-weight:700">${s.meta.title}</div><div style="font-size:12px;color:#9ca3af">${s.meta.artist}</div></div><div><button onclick="(async()=>{await LumicIDB.deleteSong('${s.uid}');location.reload();})()" style="background:#ff5252;padding:8px 10px;border-radius:8px;border:0;color:#fff">Remove</button></div></div>`).join('');
}
</script>
</body>
</html>
